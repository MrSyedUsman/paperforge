name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  REGISTRY: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/paperforge
  BACKEND_SERVICE: paperforge-backend
  FRONTEND_SERVICE: paperforge-frontend

jobs:
  backend:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - name: Build and push image
        run: |
          docker build -f paperforge-backend/Dockerfile -t "$REGISTRY/backend:${{ github.sha }}" .
          docker push "$REGISTRY/backend:${{ github.sha }}"
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.BACKEND_SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.REGISTRY }}/backend:${{ github.sha }}
          flags: --allow-unauthenticated
          env_vars: |
            FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
            FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
            FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
            FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
            SEED_USERNAME=${{ secrets.SEED_USERNAME }}
            SEED_PASSWORD=${{ secrets.SEED_PASSWORD }}
            SEED_DISPLAY_NAME=${{ secrets.SEED_DISPLAY_NAME }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

  frontend:
    needs: backend
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - name: Resolve backend URL
        id: backend-url
        run: |
          URL="$(gcloud run services describe "$BACKEND_SERVICE" --region "$REGION" --format='value(status.url)')"
          if [ -z "$URL" ]; then echo "Could not resolve the backend Cloud Run URL" >&2; exit 1; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Build and push image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="${{ steps.backend-url.outputs.url }}/api" \
            -f paperforge-frontend/Dockerfile -t "$REGISTRY/frontend:${{ github.sha }}" .
          docker push "$REGISTRY/frontend:${{ github.sha }}"
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.FRONTEND_SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.REGISTRY }}/frontend:${{ github.sha }}
          flags: --allow-unauthenticated

  allow-frontend-origin:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Allow the frontend origins in backend CORS
        run: |
          # Cloud Run serves a service on several URLs (e.g. SERVICE-HASH-el.a.run.app and
          # SERVICE-PROJECTNUMBER.REGION.run.app). Browsers send whichever one the user opened,
          # so every URL of the frontend must be an allowed origin.
          ORIGINS="$(gcloud run services describe "$FRONTEND_SERVICE" --region "$REGION" \
            --format=json | python3 -c '
          import json, sys
          svc = json.load(sys.stdin)
          urls = set(json.loads(svc["metadata"]["annotations"].get("run.googleapis.com/urls", "[]")))
          urls.add(svc["status"]["url"])
          print(",".join(sorted(u.rstrip("/") for u in urls)))
          ')"
          if [ -z "$ORIGINS" ]; then echo "Could not resolve the frontend Cloud Run URLs" >&2; exit 1; fi
          echo "Allowing origins: $ORIGINS"
          gcloud run services update "$BACKEND_SERVICE" --region "$REGION" \
            --update-env-vars "^@^FRONTEND_ORIGIN=$ORIGINS"
